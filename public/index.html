<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OpBritops Assistant</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <main>
      <h1>OpBritops Assistant</h1>
      <p class="langs">English · Español · Français · Português · Deutsch</p>
      <div id="log" role="log" aria-live="polite"></div>
      <form id="form" autocomplete="off">
        <input id="input" type="text" maxlength="1000" placeholder="Type your message…" aria-label="Message" required />
        <button id="send" type="submit">Send</button>
      </form>
    </main>
    <script src="/app.js"></script>
  </body>
</html>
